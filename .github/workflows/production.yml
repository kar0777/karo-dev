# ==================================================================== #
#  Karo — production maintenance
#
#  The Vercel deployment itself is driven by Vercel's Git integration:
#  every push to main is built and released without this file. What a
#  push does NOT do is migrate the database or run the periodic sweeps —
#  Vercel's cron entry (see vercel.json) fires once per day on the free
#  plan, and a build has no database credentials.
#
#  This workflow covers both, and only when the operator has chosen to:
#  each job reads its own secrets at job level and its steps no-op with
#  a clear notice while a secret is unset, so the file is inert on a
#  fresh fork.
#
#    · migrate — applies ./drizzle migrations to the production database
#                (KARO_DATABASE_URL) after each push to main.
#    · tick    — pings /api/cron/tick hourly (KARO_BASE_URL +
#                KARO_CRON_SECRET), so sandboxes sleep and billing sweeps
#                land far sooner than the daily Vercel cron without
#                paying for a scheduler VM.
#
#  Secrets expected (GitHub → Settings → Secrets and variables → Actions):
#    KARO_DATABASE_URL   postgresql://…/karo  (Neon pooled connection)
#    KARO_BASE_URL       https://your-project.vercel.app
#    KARO_CRON_SECRET    the value of CRON_SECRET in Vercel
#
#  Structural note: the `secrets` context is read ONLY as job-level env
#  values, and gating happens in step-level `if`s against that env. Job
#  level `if`s and top-level env values never touch secrets here.
# ==================================================================== #

name: Production

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  migrate:
    name: Migrate database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.KARO_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Explain skip
        if: env.DATABASE_URL == ''
        run: echo "KARO_DATABASE_URL is not set — migrations skipped (see the header of this file)."

      - name: Install
        if: env.DATABASE_URL != ''
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        if: env.DATABASE_URL != ''
        run: npx tsx src/lib/db/migrate.ts

      # Provider registry rows (anthropic, hypercli, …) so Admin → Models sync,
      # catalogue discovery and the BYOK dialog know them without a full reseed.
      - name: Sync provider registry
        if: env.DATABASE_URL != ''
        run: npx tsx --tsconfig ./tsconfig.scripts.json src/lib/db/sync-providers.ts

  tick:
    name: Maintenance tick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KARO_BASE_URL: ${{ secrets.KARO_BASE_URL }}
      KARO_CRON_SECRET: ${{ secrets.KARO_CRON_SECRET }}

    steps:
      - name: Explain skip
        if: env.KARO_BASE_URL == '' || env.KARO_CRON_SECRET == ''
        run: echo "KARO_BASE_URL / KARO_CRON_SECRET are not set — tick skipped (see the header of this file)."

      - name: Ping /api/cron/tick
        if: env.KARO_BASE_URL != '' && env.KARO_CRON_SECRET != ''
        run: |
          curl -fsS --max-time 60 "${KARO_BASE_URL}/api/cron/tick" \
            -H "Authorization: Bearer ${KARO_CRON_SECRET}" \
            -H "User-Agent: karo-github-tick/1.0"
