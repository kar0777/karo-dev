# ==================================================================== #
#  Karo — production maintenance
#
#  The Vercel deployment itself is driven by Vercel's Git integration:
#  every push to main is built and released without this file. What a
#  push does NOT do is migrate the database or run the periodic sweeps —
#  Vercel's cron entry (see vercel.json) fires once per day on the free
#  plan, and a build has no database credentials.
#
#  This workflow covers both, and only when the operator has chosen to:
#  every job is skipped until its secret exists, so the file is inert on
#  a fresh fork and needs no "continue-as-is" babysitting.
#
#    · migrate  — applies ./drizzle migrations to the production
#                 database (KARO_DATABASE_URL) after each push to main.
#    · tick     — pings /api/cron/tick hourly (KARO_BASE_URL +
#                 KARO_CRON_SECRET), so sandboxes sleep and billing
#                 sweeps land far sooner than the daily Vercel cron
#                 without paying for a scheduler VM.
#
#  Secrets expected (GitHub → Settings → Secrets and variables → Actions):
#    KARO_DATABASE_URL   postgresql://…/karo  (Neon pooled connection)
#    KARO_BASE_URL       https://your-project.vercel.app
#    KARO_CRON_SECRET    the value of CRON_SECRET in Vercel
# ==================================================================== #

name: Production

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  KARO_DATABASE_URL: ${{ secrets.KARO_DATABASE_URL }}
  KARO_BASE_URL: ${{ secrets.KARO_BASE_URL }}
  KARO_CRON_SECRET: ${{ secrets.KARO_CRON_SECRET }}

jobs:
  # ---------------------------------------------------------------- #
  #  Database migrations — additive by project rule, safe to re-run
  # ---------------------------------------------------------------- #
  migrate:
    name: Migrate database
    runs-on: ubuntu-latest
    if: ${{ env.KARO_DATABASE_URL != '' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.KARO_DATABASE_URL }}
        run: npx tsx src/lib/db/migrate.ts

  # ---------------------------------------------------------------- #
  #  Skipped-job visibility — an empty runs list should say why
  # ---------------------------------------------------------------- #
  migrate-skipped:
    name: Migrate database (no secret — skipped)
    runs-on: ubuntu-latest
    if: ${{ env.KARO_DATABASE_URL == '' }}
    steps:
      - name: Explain
        run: echo "KARO_DATABASE_URL is not set — see DEPLOY.md, step 4."

  # ---------------------------------------------------------------- #
  #  Maintenance tick — hourly, so the free plan behaves like an
  #  operated deployment rather than a daily-swept demo
  # ---------------------------------------------------------------- #
  tick:
    name: Maintenance tick
    runs-on: ubuntu-latest
    if: ${{ env.KARO_BASE_URL != '' && env.KARO_CRON_SECRET != '' }}
    timeout-minutes: 5

    steps:
      - name: Ping /api/cron/tick
        run: |
          curl -fsS --max-time 60 "${KARO_BASE_URL}/api/cron/tick" \
            -H "Authorization: Bearer ${KARO_CRON_SECRET}" \
            -H "User-Agent: karo-github-tick/1.0"

  tick-skipped:
    name: Maintenance tick (no secrets — skipped)
    runs-on: ubuntu-latest
    if: ${{ env.KARO_BASE_URL == '' || env.KARO_CRON_SECRET == '' }}
    steps:
      - name: Explain
        run: echo "KARO_BASE_URL / KARO_CRON_SECRET are not set — see DEPLOY.md, step 5."
